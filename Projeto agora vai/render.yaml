# Render Blueprint: cria o site + o banco PostgreSQL automaticamente.
# Python 3.12 (estável e compatível com todas as bibliotecas do requirements.txt).
databases:
  - name: perfumaria-db
    databaseName: perfumaria
    user: perfumaria
    plan: free          # troque por um plano pago (ex.: basic-256mb) para o banco não expirar
    ipAllowList: []     # somente serviços do próprio Render acessam o banco

services:
  - type: web
    name: perfumaria
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # init_db: aguarda o banco, roda as migrations, cria dados iniciais e o administrador.
    startCommand: python manage.py init_db && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: perfumaria-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true     # gerada pelo Render
      - key: ADMIN_PASSWORD
        generateValue: true     # gerada pelo Render (veja em Environment)
      - key: ADMIN_EMAIL
        value: admin@minhaloja.com   # troque no painel do Render se quiser
      - key: ADMIN_NAME
        value: Administrador
